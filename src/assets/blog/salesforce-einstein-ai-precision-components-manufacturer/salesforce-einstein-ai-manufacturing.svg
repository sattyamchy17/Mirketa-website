<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="eiBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2438" />
      <stop offset="100%" stop-color="#0d3b3d" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#eiBg)" />

  <circle cx="1100" cy="90" r="160" fill="#123049" opacity="0.55" />
  <circle cx="50" cy="600" r="140" fill="#0f6b3f" opacity="0.35" />
  <circle cx="1170" cy="610" r="4" fill="#8fd9b3" opacity="0.6" />

  <!-- heading -->
  <text x="70" y="96" font-family="IBM Plex Serif, Georgia, serif" font-size="30" font-weight="700" fill="#ffffff">Transforming Sales &amp; Operations</text>
  <text x="70" y="134" font-family="IBM Plex Serif, Georgia, serif" font-size="30" font-weight="700" fill="#ffffff">with Salesforce Einstein AI</text>
  <text x="70" y="170" font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#bcd7f5">Smarter quoting, predictive maintenance, and visual quality control</text>

  <!-- connecting lines -->
  <g stroke="#21ad65" stroke-width="1.6" opacity="0.6" fill="none">
    <path d="M270 400 h130" />
    <path d="M700 400 h130" />
  </g>
  <path d="M660 400 l30 -14 v28 z" fill="#21ad65" opacity="0.85" />
  <path d="M1090 400 l30 -14 v28 z" fill="#21ad65" opacity="0.85" />

  <!-- quote / precision part icon -->
  <g transform="translate(180,400)">
    <circle r="56" fill="#0f2438" stroke="#8fd9b3" stroke-width="2.4" />
    <circle r="20" fill="none" stroke="#8fd9b3" stroke-width="2.2" />
    <circle r="6" fill="#8fd9b3" />
    <g stroke="#8fd9b3" stroke-width="2">
      <line x1="0" y1="-28" x2="0" y2="-20" />
      <line x1="0" y1="20" x2="0" y2="28" />
      <line x1="-28" y1="0" x2="-20" y2="0" />
      <line x1="20" y1="0" x2="28" y2="0" />
    </g>
  </g>
  <text x="180" y="475" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#bcd7f5">Quotes &amp; Sensor Data</text>

  <!-- Einstein AI hub -->
  <g transform="translate(600,400)">
    <circle r="52" fill="#21ad65" opacity="0.9" />
    <path d="M-14 8c0-14 8-22 14-22s14 8 14 22" fill="none" stroke="#0f2438" stroke-width="2.4" stroke-linecap="round" />
    <circle cx="0" cy="-14" r="4" fill="#0f2438" />
    <text x="0" y="26" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="700" font-size="11" fill="#0f2438">Einstein AI</text>
  </g>

  <!-- quality / maintenance output -->
  <g transform="translate(1020,400)">
    <circle r="56" fill="#0f2438" stroke="#8fd9b3" stroke-width="2.4" />
    <path d="M-14 4 L-4 14 L16 -10" fill="none" stroke="#8fd9b3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="1020" y="475" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#bcd7f5">Quality &amp; Uptime</text>

  <!-- footer tag row -->
  <text x="70" y="610" font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#9db9d6">Einstein Analytics &#183; Predictive Maintenance &#183; Einstein Vision &#183; Data Centralization</text>
