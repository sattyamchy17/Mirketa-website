      <stop offset="0%" stop-color="#0f2438" />
      <stop offset="100%" stop-color="#0d3b3d" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#s360Bg)" />

  <circle cx="1100" cy="90" r="160" fill="#123049" opacity="0.55" />
  <circle cx="50" cy="600" r="140" fill="#0f6b3f" opacity="0.35" />
  <circle cx="1170" cy="610" r="4" fill="#8fd9b3" opacity="0.6" />

  <!-- heading -->
  <text x="70" y="96" font-family="IBM Plex Serif, Georgia, serif" font-size="31" font-weight="700" fill="#ffffff">Better Enrollment Through</text>
  <text x="70" y="134" font-family="IBM Plex Serif, Georgia, serif" font-size="31" font-weight="700" fill="#ffffff">Student 360</text>
  <text x="70" y="170" font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#bcd7f5">Centralized lead management on Salesforce EDA</text>

  <!-- connecting lines -->
  <g stroke="#21ad65" stroke-width="1.6" opacity="0.6" fill="none">
    <path d="M270 400 h130" />
    <path d="M700 400 h130" />
  </g>
  <path d="M660 400 l30 -14 v28 z" fill="#21ad65" opacity="0.85" />
  <path d="M1090 400 l30 -14 v28 z" fill="#21ad65" opacity="0.85" />

  <!-- lead / prospective student icon -->
  <g transform="translate(180,400)">
    <circle r="56" fill="#0f2438" stroke="#8fd9b3" stroke-width="2.4" />
    <circle cx="0" cy="-8" r="12" fill="none" stroke="#8fd9b3" stroke-width="2.2" />
    <path d="M-18 22c0-12 8-18 18-18s18 6 18 18" fill="none" stroke="#8fd9b3" stroke-width="2.2" stroke-linecap="round" />
  </g>
  <text x="180" y="475" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#bcd7f5">Prospective Students</text>

  <!-- Student 360 / EDA hub -->
  <g transform="translate(600,400)">
