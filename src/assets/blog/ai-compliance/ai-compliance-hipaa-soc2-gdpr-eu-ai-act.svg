<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="acBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#2c2a5e" />
    </linearGradient>
    <linearGradient id="acShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fcf8e" />
      <stop offset="100%" stop-color="#1f9a5f" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#acBg)" />

  <!-- ambient decorative circles -->
  <circle cx="1080" cy="70" r="180" fill="#f3f1ff" opacity="0.05" />
  <circle cx="1180" cy="90" r="90" fill="#4c3fae" opacity="0.18" />
  <circle cx="60" cy="640" r="150" fill="#8fe3b5" opacity="0.06" />
  <circle cx="165" cy="55" r="4" fill="#c9c3f5" opacity="0.6" />
  <circle cx="200" cy="48" r="2.5" fill="#c9c3f5" opacity="0.4" />

  <!-- heading -->
  <text x="70" y="105" font-family="IBM Plex Serif, Georgia, serif" font-size="46" font-weight="700" fill="#ffffff">AI compliance, explained</text>
  <text x="70" y="145" font-family="IBM Plex Sans, sans-serif" font-size="20" fill="#c9c3f5">A practical map of the rules shaping AI systems today</text>

  <!-- connecting lines (drawn first, behind nodes) -->
  <g stroke="#5fb89a" stroke-width="1.4" opacity="0.55">
    <path d="M395 300 L610 260" fill="none" />
    <path d="M395 330 L610 470" fill="none" />
    <path d="M395 360 L610 500" fill="none" />
    <path d="M395 390 L610 545" fill="none" />
    <path d="M395 345 L940 300" fill="none" />
    <path d="M760 500 L935 465" fill="none" />
  </g>

  <!-- shield with checkmark -->
  <g transform="translate(200,340)">
    <path d="M0 -110 L95 -70 L95 5 C95 75 45 120 0 145 C-45 120 -95 75 -95 5 L-95 -70 Z" fill="url(#acShield)" />
    <path d="M-45 5 L-12 40 L55 -45" stroke="#eafff2" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- pills, 2x2 -->
  <rect x="610" y="228" width="205" height="64" rx="32" fill="#d7f5e4" />
  <text x="712" y="268" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600" font-size="24" fill="#0f6b3f">HIPAA</text>

  <rect x="935" y="270" width="205" height="64" rx="32" fill="#ddd6f7" />
  <text x="1037" y="310" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600" font-size="24" fill="#3730a3">SOC 2</text>

  <rect x="610" y="470" width="205" height="64" rx="32" fill="#fbd6c4" />
  <text x="712" y="510" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600" font-size="24" fill="#9a3412">GDPR</text>

  <rect x="935" y="433" width="215" height="64" rx="32" fill="#fde3a3" />
  <text x="1042" y="473" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600" font-size="24" fill="#92400e">EU AI Act</text>

  <!-- footer tag row -->
  <text x="70" y="615" font-family="IBM Plex Sans, sans-serif" font-size="19" fill="#a9a3d0">Data privacy &#183; Security controls &#183; Governance &#183; Risk management</text>
</svg>
