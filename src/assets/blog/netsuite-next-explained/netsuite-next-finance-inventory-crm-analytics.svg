<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="nnBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2942" />
      <stop offset="100%" stop-color="#1c3d5e" />
    </linearGradient>
    <linearGradient id="nnCloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a9be8" />
      <stop offset="100%" stop-color="#2f7fe0" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#nnBg)" />

  <!-- ambient decorative circles -->
  <circle cx="1080" cy="70" r="180" fill="#0d3560" opacity="0.55" />
  <circle cx="1170" cy="55" r="80" fill="#3f8ce6" opacity="0.5" />
  <circle cx="40" cy="650" r="160" fill="#2f7fe0" opacity="0.55" />
  <circle cx="165" cy="55" r="4" fill="#bcd7f5" opacity="0.6" />
  <circle cx="200" cy="48" r="2.5" fill="#bcd7f5" opacity="0.4" />

  <!-- heading -->
  <text x="70" y="105" font-family="IBM Plex Serif, Georgia, serif" font-size="46" font-weight="700" fill="#ffffff">NetSuite Next, explained</text>
  <text x="70" y="145" font-family="IBM Plex Sans, sans-serif" font-size="20" fill="#bcd7f5">What's new in the platform's next generation</text>

  <!-- connecting lines (behind nodes) -->
  <g stroke="#7fa8cf" stroke-width="1.4" opacity="0.55">
    <path d="M395 300 L610 260" fill="none" />
    <path d="M395 330 L610 470" fill="none" />
    <path d="M395 360 L610 500" fill="none" />
    <path d="M395 390 L610 545" fill="none" />
    <path d="M395 345 L940 300" fill="none" />
    <path d="M760 500 L935 465" fill="none" />
  </g>

  <!-- cloud icon -->
  <g transform="translate(280,340)">
    <path d="M-105 60 a55 55 0 0 1 20 -107 a70 70 0 0 1 132 -12 a58 58 0 0 1 8 119 Z" fill="url(#nnCloud)" />
    <g stroke="#ffffff" stroke-width="7" stroke-linecap="round">
      <line x1="-30" y1="0" x2="-30" y2="28" />
      <line x1="0" y1="0" x2="0" y2="28" />
      <line x1="30" y1="0" x2="30" y2="28" />
      <line x1="-30" y1="28" x2="30" y2="28" />
    </g>
    <circle cx="-30" cy="-8" r="9" fill="#ffffff" />
    <circle cx="0" cy="-8" r="9" fill="#ffffff" />
    <circle cx="30" cy="-8" r="9" fill="#ffffff" />
  </g>

  <!-- pills, 2x2 -->
  <rect x="610" y="228" width="205" height="64" rx="32" fill="#eef4fb" />
  <text x="712" y="268" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600" font-size="24" fill="#0f2942">Finance</text>

  <rect x="935" y="270" width="205" height="64" rx="32" fill="#ded6f7" />
  <text x="1037" y="310" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600" font-size="24" fill="#3730a3">Inventory</text>

  <rect x="610" y="470" width="205" height="64" rx="32" fill="#c9f0dc" />
  <text x="712" y="510" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600" font-size="24" fill="#0f6b3f">CRM</text>

  <rect x="935" y="433" width="215" height="64" rx="32" fill="#fde3a3" />
  <text x="1042" y="473" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="600" font-size="24" fill="#92400e">Analytics</text>

  <!-- footer tag row -->
  <text x="70" y="615" font-family="IBM Plex Sans, sans-serif" font-size="19" fill="#9db9d6">Unified data &#183; Faster workflows &#183; Built-in AI &#183; Cloud-native</text>
