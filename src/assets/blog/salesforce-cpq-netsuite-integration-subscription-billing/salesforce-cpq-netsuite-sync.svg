<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="cnBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2438" />
      <stop offset="100%" stop-color="#0d3b3d" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#cnBg)" />

  <circle cx="1100" cy="90" r="160" fill="#123049" opacity="0.55" />
  <circle cx="50" cy="600" r="140" fill="#0f6b3f" opacity="0.35" />
  <circle cx="1170" cy="610" r="4" fill="#8fd9b3" opacity="0.6" />

  <!-- heading -->
  <text x="70" y="100" font-family="IBM Plex Serif, Georgia, serif" font-size="34" font-weight="700" fill="#ffffff">Salesforce CPQ Setup and</text>
  <text x="70" y="140" font-family="IBM Plex Serif, Georgia, serif" font-size="34" font-weight="700" fill="#ffffff">NetSuite Integration</text>
  <text x="70" y="176" font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#bcd7f5">Real-time two-way sync for subscription billing at scale</text>

  <!-- bidirectional connecting lines -->
  <g stroke="#21ad65" stroke-width="1.6" opacity="0.6" fill="none">
    <path d="M270 388 h130" />
    <path d="M700 388 h130" />
    <path d="M270 412 h130" />
    <path d="M700 412 h130" />
  </g>
  <path d="M660 388 l30 -14 v28 z" fill="#21ad65" opacity="0.85" />
  <path d="M310 412 l-30 14 v-28 z" fill="#21ad65" opacity="0.85" />
  <path d="M1090 388 l30 -14 v28 z" fill="#21ad65" opacity="0.85" />
  <path d="M740 412 l-30 14 v-28 z" fill="#21ad65" opacity="0.85" />

  <!-- CPQ icon -->
  <g transform="translate(180,400)">
    <circle r="56" fill="#0f2438" stroke="#8fd9b3" stroke-width="2.4" />
    <text x="0" y="6" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="700" font-size="15" fill="#8fd9b3">CPQ</text>
  </g>
  <text x="180" y="475" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#bcd7f5">Subscription Billing</text>

  <!-- REST API sync hub -->
  <g transform="translate(600,400)">
    <circle r="52" fill="#21ad65" opacity="0.9" />
    <path d="M-16 0h32M-16 0l8 -8M-16 0l8 8M16 0l-8 -8M16 0l-8 8" stroke="#0f2438" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="600" y="475" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#8fd9b3">REST API Sync</text>

  <!-- NetSuite / invoice icon -->
  <g transform="translate(1020,400)">
    <circle r="56" fill="#0f2438" stroke="#8fd9b3" stroke-width="2.4" />
    <rect x="-16" y="-22" width="32" height="44" rx="3" fill="none" stroke="#8fd9b3" stroke-width="2.2" />
    <line x1="-8" y1="-10" x2="8" y2="-10" stroke="#8fd9b3" stroke-width="2" />
    <line x1="-8" y1="-1" x2="8" y2="-1" stroke="#8fd9b3" stroke-width="2" />
    <line x1="-8" y1="8" x2="4" y2="8" stroke="#8fd9b3" stroke-width="2" />
  </g>
  <text x="1020" y="475" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#bcd7f5">NetSuite Invoicing</text>

  <!-- footer tag row -->
  <text x="70" y="610" font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#9db9d6">Real-Time Sync &#183; SFTP Fulfillment Data &#183; Automated Invoicing</text>
</svg>
