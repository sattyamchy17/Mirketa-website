<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="e2eBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2438" />
      <stop offset="100%" stop-color="#0d3b3d" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#e2eBg)" />

  <circle cx="1100" cy="90" r="160" fill="#123049" opacity="0.55" />
  <circle cx="50" cy="600" r="140" fill="#0f6b3f" opacity="0.35" />
  <circle cx="1170" cy="610" r="4" fill="#8fd9b3" opacity="0.6" />

  <!-- heading -->
  <text x="70" y="96" font-family="IBM Plex Serif, Georgia, serif" font-size="32" font-weight="700" fill="#ffffff">End-to-End Digital Sales Journey</text>
  <text x="70" y="134" font-family="IBM Plex Serif, Georgia, serif" font-size="32" font-weight="700" fill="#ffffff">for a Logistics Service Provider</text>
  <text x="70" y="168" font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#bcd7f5">From secure lead capture to fully onboarded, quoted, and verified</text>

  <!-- 4-stage horizontal flow -->
  <g stroke="#21ad65" stroke-width="1.5" opacity="0.6" fill="none">
    <path d="M195 420 h115" />
    <path d="M490 420 h115" />
    <path d="M785 420 h115" />
  </g>
  <path d="M290 420 l24 -11 v22 z" fill="#21ad65" opacity="0.85" />
  <path d="M585 420 l24 -11 v22 z" fill="#21ad65" opacity="0.85" />
  <path d="M880 420 l24 -11 v22 z" fill="#21ad65" opacity="0.85" />

  <!-- 1. JWT lead capture -->
  <g transform="translate(150,420)">
    <circle r="44" fill="#0f2438" stroke="#8fd9b3" stroke-width="2.3" />
    <rect x="-13" y="-4" width="26" height="20" rx="3" fill="none" stroke="#8fd9b3" stroke-width="2" />
    <path d="M-7 -4 v-8a7 7 0 0 1 14 0v8" fill="none" stroke="#8fd9b3" stroke-width="2" />
  </g>
  <text x="150" y="480" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#bcd7f5">Secure Lead Capture</text>

  <!-- 2. product/cart config -->
  <g transform="translate(445,420)">
    <circle r="44" fill="#0f2438" stroke="#8fd9b3" stroke-width="2.3" />
    <rect x="-15" y="-14" width="14" height="16" rx="2" fill="none" stroke="#8fd9b3" stroke-width="2" />
    <rect x="1" y="-14" width="14" height="16" rx="2" fill="none" stroke="#8fd9b3" stroke-width="2" />
    <line x1="-15" y1="10" x2="15" y2="10" stroke="#8fd9b3" stroke-width="2" />
  </g>
  <text x="445" y="480" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#bcd7f5">Pricing &amp; Quote</text>

  <!-- 3. KYC shield -->
  <g transform="translate(740,420)">
    <circle r="44" fill="#0f2438" stroke="#21ad65" stroke-width="2.6" />
    <path d="M0 -20 L16 -13 V4 C16 15 8 23 0 27 C-8 23 -16 15 -16 4 V-13 Z" fill="none" stroke="#8fd9b3" stroke-width="2.4" stroke-linejoin="round" />
    <path d="M-7 3 L-1 9 L10 -5" fill="none" stroke="#8fd9b3" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="740" y="480" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#bcd7f5">KYC Verification</text>

  <!-- 4. onboarded customer -->
  <g transform="translate(1035,420)">
    <circle r="44" fill="#21ad65" opacity="0.9" />
    <circle cy="-8" r="10" fill="none" stroke="#0f2438" stroke-width="2.4" />
    <path d="M-13 16c2-11 8-16 13-16s11 5 13 16" fill="none" stroke="#0f2438" stroke-width="2.4" stroke-linecap="round" />
  </g>
  <text x="1035" y="480" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#bcd7f5">Onboarded Customer</text>

  <!-- footer tag row -->
  <text x="70" y="610" font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#9db9d6">B2B Commerce &#183; CPQ &#183; Experience Cloud &#183; JWT Security &#183; LexisNexis KYC</text>
</svg>
