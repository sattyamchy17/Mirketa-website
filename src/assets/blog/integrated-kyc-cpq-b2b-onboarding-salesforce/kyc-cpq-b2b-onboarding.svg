<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="kycBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2438" />
      <stop offset="100%" stop-color="#0d3b3d" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#kycBg)" />

  <circle cx="1100" cy="90" r="160" fill="#123049" opacity="0.55" />
  <circle cx="50" cy="600" r="140" fill="#0f6b3f" opacity="0.35" />
  <circle cx="1170" cy="610" r="4" fill="#8fd9b3" opacity="0.6" />

  <!-- heading -->
  <text x="70" y="100" font-family="IBM Plex Serif, Georgia, serif" font-size="36" font-weight="700" fill="#ffffff">Integrated KYC + CPQ for</text>
  <text x="70" y="142" font-family="IBM Plex Serif, Georgia, serif" font-size="36" font-weight="700" fill="#ffffff">Seamless B2B Onboarding</text>
  <text x="70" y="178" font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#bcd7f5">From application to verified, quote-ready lead — no manual touch</text>

  <!-- connecting line -->
  <g stroke="#21ad65" stroke-width="1.6" opacity="0.6" fill="none">
    <path d="M270 400 h130" />
    <path d="M700 400 h130" />
  </g>
  <path d="M660 400 l30 -14 v28 z" fill="#21ad65" opacity="0.85" />
  <path d="M1090 400 l30 -14 v28 z" fill="#21ad65" opacity="0.85" />

  <!-- document / application icon -->
  <g transform="translate(180,400)">
    <circle r="56" fill="#0f2438" stroke="#8fd9b3" stroke-width="2.5" />
    <rect x="-16" y="-24" width="32" height="42" rx="3" fill="none" stroke="#8fd9b3" stroke-width="2.2" />
    <line x1="-9" y1="-12" x2="9" y2="-12" stroke="#8fd9b3" stroke-width="2" />
    <line x1="-9" y1="-3" x2="9" y2="-3" stroke="#8fd9b3" stroke-width="2" />
    <line x1="-9" y1="6" x2="3" y2="6" stroke="#8fd9b3" stroke-width="2" />
  </g>

  <!-- KYC shield icon -->
  <g transform="translate(600,400)">
    <circle r="56" fill="#0f2438" stroke="#21ad65" stroke-width="3" />
    <path d="M0 -26 L20 -16 V6 C20 20 10 30 0 34 C-10 30 -20 20 -20 6 V-16 Z" fill="none" stroke="#8fd9b3" stroke-width="3" stroke-linejoin="round" />
    <path d="M-9 4 L-2 12 L12 -6" fill="none" stroke="#8fd9b3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- quote / CPQ icon -->
  <g transform="translate(1020,400)">
    <circle r="56" fill="#0f2438" stroke="#8fd9b3" stroke-width="2.5" />
    <rect x="-18" y="-22" width="36" height="44" rx="3" fill="none" stroke="#8fd9b3" stroke-width="2.2" />
    <text x="0" y="4" text-anchor="middle" font-family="IBM Plex Serif, Georgia, serif" font-size="24" fill="#8fd9b3">$</text>
  </g>

  <!-- footer tag row -->
  <text x="70" y="610" font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#9db9d6">Experience Cloud &#183; CPQ &#183; LexisNexis KYC &#183; Automated Onboarding</text>
</svg>
