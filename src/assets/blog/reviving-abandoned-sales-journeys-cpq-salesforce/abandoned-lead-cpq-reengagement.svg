<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="reBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2438" />
      <stop offset="100%" stop-color="#0d3b3d" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#reBg)" />

  <circle cx="1100" cy="90" r="160" fill="#123049" opacity="0.55" />
  <circle cx="50" cy="600" r="140" fill="#0f6b3f" opacity="0.35" />
  <circle cx="1170" cy="610" r="4" fill="#8fd9b3" opacity="0.6" />

  <!-- heading -->
  <text x="70" y="100" font-family="IBM Plex Serif, Georgia, serif" font-size="34" font-weight="700" fill="#ffffff">Reviving Abandoned Sales</text>
  <text x="70" y="142" font-family="IBM Plex Serif, Georgia, serif" font-size="34" font-weight="700" fill="#ffffff">Journeys with Automated CPQ</text>
  <text x="70" y="178" font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#bcd7f5">Turning stalled leads back into ready-made quotes</text>

  <!-- broken path (abandoned) -->
  <g stroke="#c23a3a" stroke-width="2.2" stroke-dasharray="6 8" opacity="0.65" fill="none">
    <path d="M180 400 h190" />
  </g>
  <g transform="translate(180,400)">
    <circle r="42" fill="#0f2438" stroke="#c23a3a" stroke-width="2.4" />
    <circle cx="-6" cy="-6" r="12" fill="none" stroke="#f2b8b5" stroke-width="2" />
    <line x1="3" y1="3" x2="12" y2="12" stroke="#f2b8b5" stroke-width="2.6" stroke-linecap="round" />
  </g>
  <text x="180" y="460" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#f2b8b5">Abandoned Lead</text>

  <!-- re-engagement loop arrow curving up and back to CPQ hub -->
  <path d="M420 400 C 480 320, 560 320, 600 360" stroke="#21ad65" stroke-width="1.8" opacity="0.7" fill="none" />
  <path d="M590 350 l14 -28 l24 16 z" fill="#21ad65" opacity="0.85" />

  <!-- CPQ hub -->
  <g transform="translate(660,400)">
    <circle r="52" fill="#21ad65" opacity="0.9" />
    <text x="0" y="6" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-weight="700" font-size="15" fill="#0f2438">CPQ</text>
  </g>

  <path d="M720 400 h100" stroke="#21ad65" stroke-width="1.8" opacity="0.7" fill="none" />
  <path d="M810 400 l30 -14 v28 z" fill="#21ad65" opacity="0.85" />

  <!-- quote document output -->
  <g transform="translate(960,400)">
    <circle r="52" fill="#0f2438" stroke="#8fd9b3" stroke-width="2.5" />
    <rect x="-17" y="-22" width="34" height="44" rx="3" fill="none" stroke="#8fd9b3" stroke-width="2.2" />
    <line x1="-9" y1="-10" x2="9" y2="-10" stroke="#8fd9b3" stroke-width="2" />
    <line x1="-9" y1="-1" x2="9" y2="-1" stroke="#8fd9b3" stroke-width="2" />
    <line x1="-9" y1="8" x2="3" y2="8" stroke="#8fd9b3" stroke-width="2" />
  </g>
  <text x="960" y="460" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#bcd7f5">Ready-Made Quote</text>

  <!-- footer tag row -->
  <text x="70" y="610" font-family="IBM Plex Sans, sans-serif" font-size="18" fill="#9db9d6">Abandonment Triggers &#183; Round Robin Assignment &#183; Guided CPQ Journey</text>
</svg>
