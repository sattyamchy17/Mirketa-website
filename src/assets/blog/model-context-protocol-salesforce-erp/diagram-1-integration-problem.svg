<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 460" font-family="Helvetica,Arial,Arial" overflow="hidden">
  <rect x="0" y="0" width="900" height="460" fill="#F7F8FA"></rect>
  <text fill="#1A1A2E" font-weight="700" font-size="22" text-anchor="middle" x="450" y="38">The N×M Integration Problem: Before vs After MCP</text>
  <text fill="#B23A3A" font-weight="700" font-size="16" text-anchor="middle" x="220" y="75">Before MCP — Custom Connectors</text>
  <g fill="#333333" font-size="12">
    <rect x="40" y="110" rx="6" width="120" height="34" stroke="#B23A3A" fill="#FFFFFF"></rect>
    <text text-anchor="middle" x="100" y="131">Claude</text>
    <rect x="40" y="160" rx="6" width="120" height="34" stroke="#B23A3A" fill="#FFFFFF"></rect>
    <text text-anchor="middle" x="100" y="181">ChatGPT</text>
    <rect x="40" y="210" rx="6" width="120" height="34" stroke="#B23A3A" fill="#FFFFFF"></rect>
    <text text-anchor="middle" x="100" y="231">Copilot</text>
  </g>
  <g fill="#333333" font-size="12">
    <rect x="280" y="110" rx="6" width="130" height="34" stroke="#B23A3A" fill="#FFFFFF"></rect>
    <text text-anchor="middle" x="345" y="131">Salesforce</text>
    <rect x="280" y="160" rx="6" width="130" height="34" stroke="#B23A3A" fill="#FFFFFF"></rect>
    <text text-anchor="middle" x="345" y="181">ERP</text>
    <rect x="280" y="210" rx="6" width="130" height="34" stroke="#B23A3A" fill="#FFFFFF"></rect>
    <text text-anchor="middle" x="345" y="231">Ticketing Tool</text>
  </g>
  <g stroke="#D98080" stroke-width="1.3" fill="none">
    <line x1="160" y1="127" x2="280" y2="127"></line>
    <line x1="160" y1="127" x2="280" y2="177"></line>
    <line x1="160" y1="127" x2="280" y2="227"></line>
    <line x1="160" y1="177" x2="280" y2="127"></line>
    <line x1="160" y1="177" x2="280" y2="177"></line>
    <line x1="160" y1="177" x2="280" y2="227"></line>
    <line x1="160" y1="227" x2="280" y2="127"></line>
    <line x1="160" y1="227" x2="280" y2="177"></line>
    <line x1="160" y1="227" x2="280" y2="227"></line>
  </g>
  <text fill="#8A3A3A" font-size="12" text-anchor="middle" x="220" y="280">9 separate custom integrations</text>
  <text fill="#8A3A3A" font-size="12" text-anchor="middle" x="220" y="298">each with its own auth, mapping,</text>
  <text fill="#8A3A3A" font-size="12" text-anchor="middle" x="220" y="316">and maintenance burden</text>
  <line x1="450" y1="70" x2="450" y2="420" stroke="#CCCCCC" stroke-width="1" stroke-dasharray="5 4"></line>
  <text fill="#1A7A4A" font-weight="700" font-size="16" text-anchor="middle" x="680" y="75">After MCP — One Standard Protocol</text>
  <g fill="#333333" font-size="12">
    <rect x="500" y="110" rx="6" width="120" height="34" stroke="#1A7A4A" fill="#FFFFFF"></rect>
    <text text-anchor="middle" x="560" y="131">Claude</text>
    <rect x="500" y="160" rx="6" width="120" height="34" stroke="#1A7A4A" fill="#FFFFFF"></rect>
    <text text-anchor="middle" x="560" y="181">ChatGPT</text>
    <rect x="500" y="210" rx="6" width="120" height="34" stroke="#1A7A4A" fill="#FFFFFF"></rect>
    <text text-anchor="middle" x="560" y="231">Copilot</text>
  </g>
  <circle cx="710" cy="177" r="42" stroke="#1A7A4A" stroke-width="2" fill="#E6F6EE"></circle>
  <text fill="#1A7A4A" font-weight="700" font-size="12" text-anchor="middle" x="710" y="173">MCP</text>
  <text fill="#1A7A4A" font-size="11" text-anchor="middle" x="710" y="188">Standard</text>
  <g stroke="#1A7A4A" stroke-width="1.6" fill="none">
    <line x1="620" y1="127" x2="672" y2="163"></line>
    <line x1="620" y1="177" x2="668" y2="177"></line>
    <line x1="620" y1="227" x2="672" y2="191"></line>
  </g>
  <g fill="#333333" font-size="12">
    <rect x="800" y="110" rx="6" width="90" height="34" stroke="#1A7A4A" fill="#FFFFFF"></rect>
    <text font-size="11" text-anchor="middle" x="845" y="131">Salesforce</text>
    <rect x="800" y="160" rx="6" width="90" height="34" stroke="#1A7A4A" fill="#FFFFFF"></rect>
    <text font-size="11" text-anchor="middle" x="845" y="181">ERP</text>
    <rect x="800" y="210" rx="6" width="90" height="34" stroke="#1A7A4A" fill="#FFFFFF"></rect>
    <text font-size="10" text-anchor="middle" x="845" y="231">Ticketing</text>
  </g>
  <g stroke="#1A7A4A" stroke-width="1.6" fill="none">
    <line x1="748" y1="163" x2="800" y2="127"></line>
    <line x1="752" y1="177" x2="800" y2="177"></line>
    <line x1="748" y1="191" x2="800" y2="227"></line>
  </g>
  <text fill="#1A7A4A" font-size="12" text-anchor="middle" x="680" y="290">Build one MCP server per system.</text>
  <text fill="#1A7A4A" font-size="12" text-anchor="middle" x="680" y="308">Any MCP-compatible AI tool connects</text>
  <text fill="#1A7A4A" font-size="12" text-anchor="middle" x="680" y="326">to it — no per-tool rebuild needed.</text>
</svg>
