<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="abtBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#081018" />
      <stop offset="55%" stop-color="#0c1f2c" />
      <stop offset="100%" stop-color="#0f2438" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#abtBg)" />

  <!-- faint dot-grid, upper-left -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="60" cy="80" r="2" /><circle cx="120" cy="80" r="2" /><circle cx="180" cy="80" r="2" /><circle cx="240" cy="80" r="2" /><circle cx="300" cy="80" r="2" />
    <circle cx="60" cy="130" r="2" /><circle cx="120" cy="130" r="2" /><circle cx="180" cy="130" r="2" /><circle cx="240" cy="130" r="2" /><circle cx="300" cy="130" r="2" />
    <circle cx="60" cy="180" r="2" /><circle cx="120" cy="180" r="2" /><circle cx="180" cy="180" r="2" /><circle cx="240" cy="180" r="2" /><circle cx="300" cy="180" r="2" />
  </g>

  <!-- abstract network of generic "people" nodes, connected -- represents
       the team, not any specific individual: every node is identical. -->
  <g stroke="#21ad65" stroke-width="1.2" opacity="0.4">
    <path d="M1180 360 L1340 260" />
    <path d="M1180 360 L1300 470" />
    <path d="M1180 360 L1020 470" />
    <path d="M1340 260 L1470 340" />
    <path d="M1300 470 L1440 560" />
    <path d="M1020 470 L1080 620" />
    <path d="M1300 470 L1080 620" />
  </g>

  <g>
