    <g transform="translate(1180,360)">
      <circle r="46" fill="#0f2438" stroke="#21ad65" stroke-width="2" />
      <circle cy="-10" r="12" fill="none" stroke="#8fd9b3" stroke-width="2" />
      <path d="M-16 22c3-14 10-20 16-20s13 6 16 20" fill="none" stroke="#8fd9b3" stroke-width="2" stroke-linecap="round" />
    </g>
    <g transform="translate(1340,260) scale(0.72)">
      <circle r="46" fill="#0f2438" stroke="#21ad65" stroke-width="2" opacity="0.85" />
      <circle cy="-10" r="12" fill="none" stroke="#8fd9b3" stroke-width="2" />
      <path d="M-16 22c3-14 10-20 16-20s13 6 16 20" fill="none" stroke="#8fd9b3" stroke-width="2" stroke-linecap="round" />
    </g>
    <g transform="translate(1470,340) scale(0.6)">
      <circle r="46" fill="#0f2438" stroke="#21ad65" stroke-width="2" opacity="0.7" />
      <circle cy="-10" r="12" fill="none" stroke="#8fd9b3" stroke-width="2" />
      <path d="M-16 22c3-14 10-20 16-20s13 6 16 20" fill="none" stroke="#8fd9b3" stroke-width="2" stroke-linecap="round" />
    </g>
    <g transform="translate(1300,470) scale(0.8)">
      <circle r="46" fill="#0f2438" stroke="#21ad65" stroke-width="2" />
      <circle cy="-10" r="12" fill="none" stroke="#8fd9b3" stroke-width="2" />
      <path d="M-16 22c3-14 10-20 16-20s13 6 16 20" fill="none" stroke="#8fd9b3" stroke-width="2" stroke-linecap="round" />
    </g>
    <g transform="translate(1020,470) scale(0.68)">
      <circle r="46" fill="#0f2438" stroke="#21ad65" stroke-width="2" opacity="0.8" />
      <circle cy="-10" r="12" fill="none" stroke="#8fd9b3" stroke-width="2" />
      <path d="M-16 22c3-14 10-20 16-20s13 6 16 20" fill="none" stroke="#8fd9b3" stroke-width="2" stroke-linecap="round" />
    </g>
    <g transform="translate(1440,560) scale(0.58)">
      <circle r="46" fill="#0f2438" stroke="#21ad65" stroke-width="2" opacity="0.65" />
      <circle cy="-10" r="12" fill="none" stroke="#8fd9b3" stroke-width="2" />
      <path d="M-16 22c3-14 10-20 16-20s13 6 16 20" fill="none" stroke="#8fd9b3" stroke-width="2" stroke-linecap="round" />
