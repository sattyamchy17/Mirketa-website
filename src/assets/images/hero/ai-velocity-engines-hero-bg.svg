<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="veBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050e12" />
      <stop offset="55%" stop-color="#0a2420" />
      <stop offset="100%" stop-color="#0f2438" />
    </linearGradient>
    <radialGradient id="veGlow" cx="0.7" cy="0.38" r="0.55">
      <stop offset="0%" stop-color="#21ad65" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#21ad65" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#veBg)" />
  <rect width="1600" height="900" fill="url(#veGlow)" />

  <!-- orbiting engine-module array around a central hub -->
