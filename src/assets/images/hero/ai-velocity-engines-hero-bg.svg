    <circle r="150" fill="none" stroke="#21ad65" stroke-opacity="0.22" stroke-width="1.2" />
    <g stroke="#21ad65" stroke-width="1.1" opacity="0.55">
      <path d="M0 0 L0 -150" /><path d="M0 0 L130 -75" /><path d="M0 0 L130 75" />
      <path d="M0 0 L0 150" /><path d="M0 0 L-130 75" /><path d="M0 0 L-130 -75" />
      <path d="M0 0 L212 -106" /><path d="M0 0 L-212 106" />
    </g>
    <g fill="#0d2233" stroke="#8fd9b3" stroke-width="1.6">
      <rect x="-18" y="-172" width="36" height="26" rx="6" />
      <rect x="112" y="-90" width="36" height="26" rx="6" />
      <rect x="112" y="60" width="36" height="26" rx="6" />
      <rect x="-18" y="148" width="36" height="26" rx="6" />
      <rect x="-148" y="60" width="36" height="26" rx="6" />
      <rect x="-148" y="-90" width="36" height="26" rx="6" />
      <rect x="196" y="-120" width="36" height="26" rx="6" />
      <rect x="-232" y="92" width="36" height="26" rx="6" />
    </g>
    <circle r="44" fill="#0d2233" stroke="#21ad65" stroke-width="2.4" />
    <path d="M-16 0h32M0 -16v32" stroke="#21ad65" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- flowing content-stream ticker along the bottom -->
