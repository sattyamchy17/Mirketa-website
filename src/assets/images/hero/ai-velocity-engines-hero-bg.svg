    <path d="M0 760 H1600" />
    <path d="M0 800 H1600" />
  </g>
  <g fill="#0d2233" stroke="#8fd9b3" stroke-width="1.4" opacity="0.85">
    <rect x="60" y="742" width="70" height="26" rx="6" />
    <rect x="220" y="742" width="70" height="26" rx="6" />
    <rect x="380" y="742" width="70" height="26" rx="6" />
    <rect x="540" y="742" width="70" height="26" rx="6" />
    <rect x="140" y="782" width="70" height="26" rx="6" />
