<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ariaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061428" />
      <stop offset="55%" stop-color="#0a2440" />
      <stop offset="100%" stop-color="#0f2438" />
    </linearGradient>
    <radialGradient id="ariaGlowGreen" cx="0.78" cy="0.3" r="0.55">
      <stop offset="0%" stop-color="#21ad65" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#21ad65" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ariaGlowBlue" cx="0.18" cy="0.75" r="0.5">
      <stop offset="0%" stop-color="#4a9fe0" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#4a9fe0" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#ariaBg)" />
  <rect width="1600" height="900" fill="url(#ariaGlowGreen)" />
  <rect width="1600" height="900" fill="url(#ariaGlowBlue)" />

  <!-- faint global grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 260H1600 M0 480H1600 M0 700H1600" />
    <path d="M420 0V900 M840 0V900 M1260 0V900" />
  </g>

  <!-- configuration pipeline: upload -> AI node -> validated change set -->
  <g stroke="#21ad65" stroke-width="1.6" fill="none" opacity="0.55">
    <path d="M980 480 C1060 480 1080 420 1160 420" stroke-dasharray="4 5" />
    <path d="M1160 420 C1230 420 1250 480 1320 480" stroke-dasharray="4 5" />
  </g>

  <!-- document card (upload) -->
  <g transform="translate(900,430)">
    <rect x="0" y="0" width="120" height="86" rx="10" fill="#0d2233" stroke="#21ad65" stroke-width="1.4" />
    <path d="M18 22h60M18 38h84M18 54h50" stroke="#8fd9b3" stroke-width="1.2" opacity="0.7" />
    <path d="M18 70l10 10 16-18" stroke="#21ad65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- AI processing node -->
  <g transform="translate(1160,420)">
    <circle r="46" fill="none" stroke="#21ad65" stroke-opacity="0.3" stroke-width="1.5" />
    <circle r="30" fill="#0d2233" stroke="#21ad65" stroke-width="1.6" />
    <path d="M-10 -4l6 6-6 6M6 -10l4 4-4 4M6 2l4 4-4 4" stroke="#21ad65" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  </g>

  <!-- validated change set package -->
  <g transform="translate(1330,430)">
    <rect x="0" y="0" width="120" height="86" rx="10" fill="#0d2233" stroke="#21ad65" stroke-width="1.4" />
    <path d="M60 14l42 24v34l-42 24-42-24V38l42-24z" stroke="#21ad65" stroke-width="1.3" opacity="0.6" />
    <path d="M46 58l10 10 20-22" stroke="#21ad65" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- floating widget silhouettes at varying depth, echoing brand motif -->
  <g fill="#0d2233" stroke="#21ad65" stroke-width="1.2" opacity="0.6">
    <rect x="200" y="150" width="120" height="80" rx="9" />
    <rect x="260" y="640" width="110" height="72" rx="9" />
    <rect x="1360" y="640" width="120" height="78" rx="9" />
  </g>

  <!-- soft floating accent dots -->
  <g fill="#21ad65" opacity="0.55">
    <circle cx="160" cy="360" r="3.5" />
    <circle cx="320" cy="300" r="3" />
    <circle cx="1450" cy="230" r="3.5" />
    <circle cx="1500" cy="560" r="3" />
  </g>
</svg>
