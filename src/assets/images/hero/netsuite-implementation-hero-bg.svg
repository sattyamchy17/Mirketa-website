  </g>
  <text x="324" y="736" font-family="IBM Plex Sans, sans-serif" font-size="8.5" fill="#f3d99b">4 of 6 subsidiaries live</text>

  <!-- growth thread + dots -->
  <path d="M60 220c220 40 440 -20 660 30s440 60 660 -20 460 -30 500 10" stroke="#21ad65" stroke-width="2" fill="none" opacity="0.35" stroke-dasharray="3 6" />
  <g fill="#21ad65" opacity="0.65">
    <circle cx="720" cy="238" r="4" /><circle cx="1380" cy="200" r="4" /><circle cx="1860" cy="230" r="5" />
  </g>
  <g fill="#e0a72e" opacity="0.5">
    <circle cx="1780" cy="870" r="3.5" />
    <circle cx="150" cy="890" r="3" />
  </g>
