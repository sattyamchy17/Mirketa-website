  <rect x="1232" y="196" width="172" height="48" rx="10" fill="#0d2848" stroke="#e0a72e" stroke-width="1.1" opacity="0.85" />
  <g font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#dff3ea">
