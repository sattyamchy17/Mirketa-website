  </g>
  <text x="324" y="668" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#dff3ea" font-weight="700">Multi-Subsidiary Rollout</text>
  <g fill="#eaf2fb" opacity="0.9">
