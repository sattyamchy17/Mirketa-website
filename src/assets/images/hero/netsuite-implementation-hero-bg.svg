  <!-- Go-live readiness panel — left -->
  <g fill="#0d2848" stroke="#21ad65" stroke-width="1.2" opacity="0.92">
    <rect x="200" y="360" width="240" height="180" rx="12" />
  </g>
  <text x="224" y="388" font-family="IBM Plex Sans, sans-serif" font-size="10" fill="#dff3ea" font-weight="700">Go-Live Readiness</text>
  <g fill="#eaf2fb" opacity="0.9">
    <rect x="224" y="406" width="8" height="8" rx="2" /><text x="238" y="414" font-family="IBM Plex Sans, sans-serif" font-size="8.5" fill="#eaf2fb">Chart of accounts mapped</text>
    <rect x="224" y="426" width="8" height="8" rx="2" /><text x="238" y="434" font-family="IBM Plex Sans, sans-serif" font-size="8.5" fill="#eaf2fb">Roles &amp; approvals configured</text>
    <rect x="224" y="446" width="8" height="8" rx="2" opacity="0.55" /><text x="238" y="454" font-family="IBM Plex Sans, sans-serif" font-size="8.5" fill="#eaf2fb" opacity="0.7">SuiteScript UAT in progress</text>
