<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1000" viewBox="0 0 1920 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nsiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081b30" />
      <stop offset="55%" stop-color="#0e2c48" />
      <stop offset="100%" stop-color="#0f2438" />
    </linearGradient>
    <radialGradient id="nsiGlowGreen" cx="0.76" cy="0.24" r="0.55">
      <stop offset="0%" stop-color="#21ad65" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#21ad65" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nsiGlowGold" cx="0.16" cy="0.82" r="0.5">
      <stop offset="0%" stop-color="#e0a72e" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#e0a72e" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1920" height="1000" fill="url(#nsiBg)" />
  <rect width="1920" height="1000" fill="url(#nsiGlowGreen)" />
  <rect width="1920" height="1000" fill="url(#nsiGlowGold)" />

  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 280H1920 M0 540H1920 M0 800H1920" />
    <path d="M480 0V1000 M960 0V1000 M1440 0V1000" />
  </g>

  <!-- NetSuite ERP core hub -->
  <circle cx="830" cy="460" r="36" fill="#e8f8f0" stroke="#21ad65" stroke-width="1.6" opacity="0.95" />
  <text x="830" y="456" font-family="IBM Plex Sans, sans-serif" font-size="8.5" font-weight="700" fill="#21ad65" text-anchor="middle">NETSUITE</text>
  <text x="830" y="470" font-family="IBM Plex Sans, sans-serif" font-size="8.5" font-weight="700" fill="#21ad65" text-anchor="middle">CORE</text>
  <g stroke="#e0a72e" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.7">
    <path d="M830 424v-56M866 460h56M830 496v56M794 460h-56M856 434l40-40M856 486l40 40M804 434l-40-40M804 486l-40 40" />
  </g>
  <g fill="#0d2848" stroke="#e0a72e" stroke-width="1" opacity="0.9">
