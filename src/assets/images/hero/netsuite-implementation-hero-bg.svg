  <circle cx="232" cy="490" r="5" fill="#21ad65" />
  <text x="244" y="494" font-family="IBM Plex Sans, sans-serif" font-size="8.5" fill="#f3d99b">Cutover window confirmed</text>
  <text x="224" y="520" font-family="IBM Plex Sans, sans-serif" font-size="8.5" fill="#f3d99b">Migration accuracy: 99.4%</text>

