    <rect x="936" y="443" width="90" height="34" rx="8" />
    <rect x="790" y="556" width="80" height="34" rx="8" />
    <rect x="634" y="443" width="90" height="34" rx="8" />
  </g>
  <g font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#f3d99b" text-anchor="middle">
