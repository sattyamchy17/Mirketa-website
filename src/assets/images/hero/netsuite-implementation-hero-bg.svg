    <rect x="1424" y="644" width="176" height="10" rx="5" />
    <rect x="1424" y="664" width="212" height="10" rx="5" opacity="0.25" />
    <rect x="1424" y="664" width="140" height="10" rx="5" opacity="0.8" />
  </g>
  <text x="1424" y="700" font-family="IBM Plex Sans, sans-serif" font-size="8.5" fill="#f3d99b">Customers, items &amp; GL history</text>
  <text x="1424" y="718" font-family="IBM Plex Sans, sans-serif" font-size="8.5" fill="#f3d99b">Reconciled against legacy ERP</text>

  <!-- Financial close orb -->
  <g opacity="0.92">
    <circle cx="1170" cy="220" r="52" fill="#0d2848" stroke="#21ad65" stroke-width="1.5" />
    <circle cx="1170" cy="220" r="26" fill="none" stroke="#e0a72e" stroke-width="1.2" opacity="0.7" />
