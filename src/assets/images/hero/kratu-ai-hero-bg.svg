<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="kratuBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04141f" />
      <stop offset="55%" stop-color="#082234" />
      <stop offset="100%" stop-color="#0f2438" />
    </linearGradient>
    <radialGradient id="kratuGlowGreen" cx="0.75" cy="0.28" r="0.55">
      <stop offset="0%" stop-color="#21ad65" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#21ad65" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="kratuGlowTeal" cx="0.2" cy="0.72" r="0.5">
      <stop offset="0%" stop-color="#3fb8c9" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3fb8c9" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#kratuBg)" />
  <rect width="1600" height="900" fill="url(#kratuGlowGreen)" />
  <rect width="1600" height="900" fill="url(#kratuGlowTeal)" />

  <!-- faint grid -->
