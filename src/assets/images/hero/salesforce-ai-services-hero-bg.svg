<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061428" />
      <stop offset="55%" stop-color="#0a2440" />
      <stop offset="100%" stop-color="#0f2438" />
    </linearGradient>
    <radialGradient id="sfGlow" cx="0.72" cy="0.42" r="0.55">
      <stop offset="0%" stop-color="#21ad65" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#21ad65" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sfGlowBlue" cx="0.22" cy="0.7" r="0.5">
      <stop offset="0%" stop-color="#4a9fe0" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#4a9fe0" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sfBg)" />
  <rect width="1600" height="900" fill="url(#sfGlow)" />
  <rect width="1600" height="900" fill="url(#sfGlowBlue)" />

  <!-- Customer 360 concentric ring motif, right of center -->
  <g transform="translate(1120,420)" stroke="#21ad65" fill="none">
    <circle r="170" stroke-opacity="0.16" stroke-width="1.5" />
    <circle r="130" stroke-opacity="0.24" stroke-width="1.5" />
    <circle r="90" stroke-opacity="0.35" stroke-width="1.5" />
    <circle r="50" stroke-opacity="0.55" stroke-width="1.8" />
    <g fill="#21ad65" stroke="none" opacity="0.85">
      <circle cx="170" cy="0" r="4" />
      <circle cx="-120" cy="90" r="4" />
      <circle cx="60" cy="-150" r="4" />
      <circle cx="-90" cy="-130" r="3.5" />
      <circle cx="130" cy="120" r="3.5" />
    </g>
  </g>

  <!-- floating dashboard / widget card silhouettes at varying depth -->
  <g fill="#0d2233" stroke="#21ad65" stroke-width="1.4">
    <rect x="760" y="180" width="150" height="96" rx="10" opacity="0.9" />
    <rect x="1230" y="230" width="120" height="80" rx="10" opacity="0.85" />
    <rect x="880" y="560" width="140" height="90" rx="10" opacity="0.85" />
    <rect x="1280" y="560" width="110" height="72" rx="10" opacity="0.8" />
  </g>
  <g stroke="#8fd9b3" stroke-width="1.2" opacity="0.7">
    <path d="M780 205h60M780 222h100M780 239h80" />
    <path d="M1250 252h50M1250 268h70" />
    <path d="M900 585h60M900 602h100M900 619h50" />
    <path d="M1300 582h50M1300 598h70" />
  </g>
  <!-- small bar-chart glyph inside one widget -->
  <g fill="#21ad65" opacity="0.8">
    <rect x="792" y="248" width="8" height="16" />
    <rect x="804" y="240" width="8" height="24" />
    <rect x="816" y="252" width="8" height="12" />
    <rect x="828" y="236" width="8" height="28" />
  </g>

  <!-- faint global grid / connectivity lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 250H1600 M0 470H1600 M0 690H1600" />
    <path d="M400 0V900 M800 0V900 M1200 0V900" />
  </g>

  <!-- soft floating accent dots, left side -->
  <g fill="#21ad65" opacity="0.55">
    <circle cx="160" cy="200" r="4" />
    <circle cx="260" cy="300" r="3" />
    <circle cx="120" cy="380" r="3" />
    <circle cx="300" cy="150" r="3.5" />
  </g>
</svg>
