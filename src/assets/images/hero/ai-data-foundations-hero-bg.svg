<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="adfBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#081018" />
      <stop offset="55%" stop-color="#0c1f2c" />
      <stop offset="100%" stop-color="#0f2438" />
    </linearGradient>
    <linearGradient id="adfLayer1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#21ad65" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#21ad65" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="adfLayer2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#21ad65" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#21ad65" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="adfLayer3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#21ad65" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#21ad65" stop-opacity="0.32" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#adfBg)" />

  <!-- dot-grid "data lake" surface, upper region -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="60" cy="80" r="2" /><circle cx="120" cy="80" r="2" /><circle cx="180" cy="80" r="2" /><circle cx="240" cy="80" r="2" /><circle cx="300" cy="80" r="2" /><circle cx="360" cy="80" r="2" />
    <circle cx="60" cy="130" r="2" /><circle cx="120" cy="130" r="2" /><circle cx="180" cy="130" r="2" /><circle cx="240" cy="130" r="2" /><circle cx="300" cy="130" r="2" /><circle cx="360" cy="130" r="2" />
    <circle cx="60" cy="180" r="2" /><circle cx="120" cy="180" r="2" /><circle cx="180" cy="180" r="2" /><circle cx="240" cy="180" r="2" /><circle cx="300" cy="180" r="2" /><circle cx="360" cy="180" r="2" />
  </g>

  <!-- stacked, flowing data-layer strata across the bottom half -->
  <path d="M0 620 C 260 560, 520 680, 800 610 C 1080 540, 1340 640, 1600 590 L1600 700 C1340 750, 1080 650, 800 720 C520 790, 260 670, 0 730 Z" fill="url(#adfLayer1)" />
  <path d="M0 700 C 260 650, 520 760, 800 700 C 1080 640, 1340 730, 1600 680 L1600 800 C1340 850, 1080 750, 800 810 C520 870, 260 770, 0 820 Z" fill="url(#adfLayer2)" />
  <path d="M0 780 C 260 740, 520 840, 800 790 C 1080 740, 1340 820, 1600 780 L1600 900 L0 900 Z" fill="url(#adfLayer3)" />

  <!-- thin contour lines along each stratum edge -->
  <path d="M0 620 C 260 560, 520 680, 800 610 C 1080 540, 1340 640, 1600 590" fill="none" stroke="#21ad65" stroke-width="1.4" opacity="0.55" />
  <path d="M0 700 C 260 650, 520 760, 800 700 C 1080 640, 1340 730, 1600 680" fill="none" stroke="#21ad65" stroke-width="1.4" opacity="0.5" />
  <path d="M0 780 C 260 740, 520 840, 800 790 C 1080 740, 1340 820, 1600 780" fill="none" stroke="#21ad65" stroke-width="1.4" opacity="0.55" />

  <!-- small floating "record" chips rising from the data layers, right side -->
  <g fill="none" stroke="#8fd9b3" stroke-width="1.6" opacity="0.85">
    <rect x="1180" y="200" width="46" height="32" rx="5" />
    <rect x="1290" y="290" width="46" height="32" rx="5" />
    <rect x="1120" y="330" width="46" height="32" rx="5" />
  </g>
  <g stroke="#21ad65" stroke-width="1" stroke-dasharray="3 4" opacity="0.5">
    <path d="M1203 232 L1203 620" />
    <path d="M1313 322 L1313 660" />
    <path d="M1143 362 L1143 600" />
  </g>

  <!-- subtle floating accent dots -->
  <g fill="#21ad65" opacity="0.5">
    <circle cx="180" cy="260" r="4" />
    <circle cx="260" cy="340" r="3" />
    <circle cx="120" cy="400" r="3" />
  </g>
</svg>
