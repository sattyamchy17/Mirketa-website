  <text x="900" y="489" font-family="IBM Plex Sans, sans-serif" font-size="8" font-weight="600" fill="#21ad65" text-anchor="middle">ENVIRONMENT</text>

  <g font-family="IBM Plex Sans, sans-serif" font-size="9" font-weight="600" fill="#bcd7f5" text-anchor="middle">
    <circle cx="720" cy="340" r="26" fill="#0f2438" stroke="#8fd9b3" stroke-width="1.4" opacity="0.9" />
