<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1000" viewBox="0 0 1920 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="awsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081b30" />
      <stop offset="55%" stop-color="#0e2c48" />
      <stop offset="100%" stop-color="#0f2438" />
    </linearGradient>
    <radialGradient id="awsGlowGreen" cx="0.78" cy="0.22" r="0.55">
      <stop offset="0%" stop-color="#21ad65" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#21ad65" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="awsGlowCyan" cx="0.14" cy="0.84" r="0.5">
      <stop offset="0%" stop-color="#2ec4d6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#2ec4d6" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1920" height="1000" fill="url(#awsBg)" />
  <rect width="1920" height="1000" fill="url(#awsGlowGreen)" />
  <rect width="1920" height="1000" fill="url(#awsGlowCyan)" />

  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 280H1920 M0 540H1920 M0 800H1920" />
    <path d="M480 0V1000 M960 0V1000 M1440 0V1000" />
  </g>

  <!-- AWS environment hub, connected to the five managed-service categories -->
