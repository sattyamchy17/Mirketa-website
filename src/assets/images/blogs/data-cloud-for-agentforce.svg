      <stop offset="0%" stop-color="#0f2438" /><stop offset="100%" stop-color="#0a1826" />
    </linearGradient>
    <radialGradient id="dcaGlow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0%" stop-color="#21ad65" stop-opacity="0.28" /><stop offset="100%" stop-color="#21ad65" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#dcaGrad)" /><rect width="1200" height="675" fill="url(#dcaGlow)" />
  <g stroke="#ffffff" stroke-opacity="0.04"><path d="M0 225H1200 M0 450H1200 M300 0V675 M600 0V675 M900 0V675" /></g>

