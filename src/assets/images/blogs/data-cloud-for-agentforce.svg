    <circle r="70" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.4" stroke-dasharray="3 5" />
    <circle cy="-14" r="18" fill="none" stroke="#8fd9b3" stroke-width="2.4" />
