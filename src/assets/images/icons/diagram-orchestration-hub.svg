  <text x="346" y="12" text-anchor="end" font-family="IBM Plex Sans, Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.2" fill="#178a4d" opacity="0.9">ENTERPRISE SYSTEMS</text>

  <!-- left column: AI models -->
