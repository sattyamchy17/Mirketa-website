<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123049" />
      <stop offset="100%" stop-color="#0c2436" />
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="552" height="412" rx="22" fill="url(#cardGrad)" stroke="#21ad65" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- header: donor identity -->
  <circle cx="58" cy="56" r="24" fill="#0f2438" stroke="#21ad65" stroke-width="1.5" />
  <path d="M46 66c0-8 6-13 12-13s12 5 12 13" stroke="#21ad65" stroke-width="1.4" stroke-linecap="round" />
  <circle cx="58" cy="48" r="6" stroke="#21ad65" stroke-width="1.4" />
  <rect x="94" y="42" width="150" height="10" rx="4" fill="#8fd9b3" opacity="0.8" />
  <rect x="94" y="60" width="100" height="8" rx="4" fill="#ffffff" opacity="0.35" />

  <!-- donor score gauge -->
  <g transform="translate(460,56)">
    <circle r="38" stroke="#1c3a52" stroke-width="8" fill="none" />
    <path d="M0 -38 A38 38 0 1 1 -32 19" stroke="#21ad65" stroke-width="8" fill="none" stroke-linecap="round" />
    <text x="0" y="6" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="700" fill="#ffffff">92</text>
  </g>
  <rect x="424" y="102" width="80" height="8" rx="4" fill="#ffffff" opacity="0.3" />

  <!-- retention bar chart -->
  <g transform="translate(40,150)">
    <rect x="0" y="90" width="0" height="0" />
    <rect x="0" y="60" width="26" height="60" rx="4" fill="#1c3a52" />
    <rect x="40" y="40" width="26" height="80" rx="4" fill="#1c3a52" />
    <rect x="80" y="20" width="26" height="100" rx="4" fill="#21ad65" />
    <rect x="120" y="0" width="26" height="120" rx="4" fill="#21ad65" />
    <path d="M13 55 L53 35 L93 15 L133 -8" stroke="#3fb8c9" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- right-side outreach note card -->
  <rect x="300" y="170" width="220" height="120" rx="14" fill="#0f2438" stroke="#21ad65" stroke-opacity="0.3" stroke-width="1.3" />
  <rect x="318" y="188" width="120" height="8" rx="4" fill="#8fd9b3" opacity="0.8" />
  <rect x="318" y="206" width="184" height="6" rx="3" fill="#ffffff" opacity="0.28" />
  <rect x="318" y="220" width="160" height="6" rx="3" fill="#ffffff" opacity="0.28" />
  <rect x="318" y="234" width="184" height="6" rx="3" fill="#ffffff" opacity="0.28" />
  <path d="M318 258l10 10 16-18" stroke="#21ad65" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="350" y="252" width="120" height="20" rx="10" fill="#21ad65" opacity="0.9" />
  <text x="410" y="266" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="10" font-weight="700" fill="#0f2438">Human-approved</text>

  <!-- footer status strip -->
  <rect x="40" y="330" width="480" height="1" fill="#1c3a52" />
  <circle cx="52" cy="356" r="4" fill="#21ad65" />
  <rect x="66" y="352" width="140" height="8" rx="4" fill="#ffffff" opacity="0.3" />
  <rect x="360" y="350" width="160" height="14" rx="7" fill="#1c3a52" />
</svg>
