<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" fill="none">
  <rect x="40" y="40" width="560" height="400" rx="16" fill="#f8f8fd" stroke="#e3e7ec" stroke-width="1.5" />

  <!-- source chips -->
  <rect x="70" y="80" width="150" height="40" rx="10" fill="#ffffff" stroke="#e3e7ec" />
  <text x="145" y="104" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" font-weight="600" fill="#1d4056">Case Details</text>

  <rect x="70" y="150" width="150" height="40" rx="10" fill="#ffffff" stroke="#e3e7ec" />
  <text x="145" y="174" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" font-weight="600" fill="#1d4056">Relevant History</text>

  <rect x="70" y="220" width="150" height="40" rx="10" fill="#ffffff" stroke="#e3e7ec" />
  <text x="145" y="244" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" font-weight="600" fill="#1d4056">Policies</text>

  <rect x="70" y="290" width="150" height="40" rx="10" fill="#ffffff" stroke="#e3e7ec" />
  <text x="145" y="314" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" font-weight="600" fill="#1d4056">Product Context</text>

  <!-- connecting lines -->
  <path d="M220 100C280 100 280 205 340 205" stroke="#c9d3da" stroke-width="1.4" fill="none" />
  <path d="M220 170C280 170 280 205 340 205" stroke="#c9d3da" stroke-width="1.4" fill="none" />
  <path d="M220 240C280 240 280 205 340 205" stroke="#c9d3da" stroke-width="1.4" fill="none" />
  <path d="M220 310C280 310 280 205 340 205" stroke="#c9d3da" stroke-width="1.4" fill="none" />

  <!-- recommendation hub -->
  <circle cx="370" cy="205" r="34" fill="#21ad65" />
  <text x="370" y="201" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="8" font-weight="700" fill="#0f2438">CONTEXT</text>
  <text x="370" y="213" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="8" font-weight="700" fill="#0f2438">ENGINE</text>

  <path d="M404 205h48" stroke="#8fa2af" stroke-width="1.4" stroke-dasharray="3 3" />
  <path d="M446 199l10 6-10 6" stroke="#8fa2af" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- output card -->
  <rect x="466" y="150" width="110" height="110" rx="12" fill="#0f2438" />
  <text x="482" y="176" font-family="IBM Plex Sans, sans-serif" font-size="8" font-weight="700" fill="#8fd9b3">NEXT ACTION</text>
  <rect x="482" y="188" width="78" height="6" rx="3" fill="#ffffff" opacity="0.3" />
  <rect x="482" y="200" width="60" height="6" rx="3" fill="#ffffff" opacity="0.3" />
  <rect x="482" y="222" width="70" height="18" rx="9" fill="#21ad65" />
  <text x="517" y="234.5" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="7.5" font-weight="700" fill="#0f2438">Diagnose</text>

  <text x="70" y="392" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#8fa2af">Case, history, policy, and product context converge before a next action is suggested.</text>
