<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" fill="none">
  <rect x="40" y="40" width="560" height="400" rx="16" fill="#0f2438" />

  <!-- KPI tiles -->
  <rect x="80" y="80" width="150" height="76" rx="12" fill="#123049" />
  <text x="98" y="106" font-family="IBM Plex Sans, sans-serif" font-size="8" font-weight="700" fill="#8fd9b3">ACCEPTANCE</text>
  <rect x="98" y="120" width="80" height="10" rx="5" fill="#21ad65" />
  <rect x="98" y="134" width="40" height="10" rx="5" fill="#ffffff" opacity="0.15" />

  <rect x="245" y="80" width="150" height="76" rx="12" fill="#123049" />
  <text x="263" y="106" font-family="IBM Plex Sans, sans-serif" font-size="8" font-weight="700" fill="#8fd9b3">RESOLUTION</text>
  <rect x="263" y="120" width="60" height="10" rx="5" fill="#3fb8c9" />
  <rect x="263" y="134" width="60" height="10" rx="5" fill="#ffffff" opacity="0.15" />

  <rect x="410" y="80" width="150" height="76" rx="12" fill="#21ad65" />
  <text x="428" y="106" font-family="IBM Plex Sans, sans-serif" font-size="8" font-weight="700" fill="#0f2438">PRODUCTIVITY</text>
  <rect x="428" y="120" width="90" height="10" rx="5" fill="#0f2438" opacity="0.6" />
  <rect x="428" y="134" width="30" height="10" rx="5" fill="#0f2438" opacity="0.25" />

  <!-- trend chart -->
  <rect x="80" y="180" width="480" height="150" rx="12" fill="#123049" />
  <text x="100" y="204" font-family="IBM Plex Sans, sans-serif" font-size="8.5" font-weight="700" fill="#8fd9b3">USAGE OVER TIME</text>
  <polyline points="100,300 160,286 220,292 280,262 340,268 400,236 460,244 520,214" fill="none" stroke="#21ad65" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="520" cy="214" r="4.5" fill="#21ad65" />
  <line x1="100" y1="312" x2="540" y2="312" stroke="#ffffff" stroke-opacity="0.1" />

  <!-- footer bars -->
  <rect x="80" y="352" width="18" height="30" fill="#3fb8c9" opacity="0.7" />
  <rect x="106" y="340" width="18" height="42" fill="#3fb8c9" opacity="0.7" />
  <rect x="132" y="330" width="18" height="52" fill="#21ad65" />
  <rect x="158" y="322" width="18" height="60" fill="#21ad65" />
  <text x="190" y="368" font-family="IBM Plex Sans, sans-serif" font-size="8" fill="#ffffff" opacity="0.5">Usage, acceptance, resolution outcomes, and productivity indicators — in one view.</text>
</svg>
