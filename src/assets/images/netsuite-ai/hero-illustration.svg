<svg xmlns="http://www.w3.org/2000/svg" width="580" height="440" viewBox="0 0 580 440" fill="none">
  <defs>
    <linearGradient id="nsCardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123049" />
      <stop offset="100%" stop-color="#0c2436" />
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="572" height="432" rx="22" fill="url(#nsCardGrad)" stroke="#21ad65" stroke-opacity="0.35" stroke-width="1.5" />

  <text x="30" y="42" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="#8fd9b3" opacity="0.8">EXECUTIVE DASHBOARD · WEST REGION</text>
  <rect x="440" y="26" width="110" height="22" rx="11" fill="rgba(224,162,63,0.16)" stroke="#e0a23f" stroke-width="1" />
  <text x="495" y="41" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9.5" font-weight="700" fill="#f0cf8f">Margin Alert</text>

  <!-- KPI tiles -->
  <g>
    <rect x="30" y="60" width="160" height="70" rx="12" fill="#0f2438" stroke="#1c3a52" stroke-width="1" />
    <text x="46" y="82" font-family="IBM Plex Sans, sans-serif" font-size="9.5" fill="#ffffff" opacity="0.6">Gross Margin</text>
    <text x="46" y="108" font-family="IBM Plex Serif, serif" font-size="20" font-weight="700" fill="#21ad65">−2.4pt</text>
  </g>
  <g>
    <rect x="200" y="60" width="160" height="70" rx="12" fill="#0f2438" stroke="#1c3a52" stroke-width="1" />
    <text x="216" y="82" font-family="IBM Plex Sans, sans-serif" font-size="9.5" fill="#ffffff" opacity="0.6">Open Exceptions</text>
    <text x="216" y="108" font-family="IBM Plex Serif, serif" font-size="20" font-weight="700" fill="#e0a23f">3</text>
  </g>
  <g>
    <rect x="370" y="60" width="180" height="70" rx="12" fill="#0f2438" stroke="#1c3a52" stroke-width="1" />
    <text x="386" y="82" font-family="IBM Plex Sans, sans-serif" font-size="9.5" fill="#ffffff" opacity="0.6">Forecast Confidence</text>
    <text x="386" y="108" font-family="IBM Plex Serif, serif" font-size="20" font-weight="700" fill="#3fb8c9">High</text>
  </g>

  <!-- AI exception chat -->
  <rect x="30" y="146" width="520" height="132" rx="14" fill="#0f2438" stroke="#21ad65" stroke-opacity="0.3" stroke-width="1.3" />
  <text x="48" y="170" font-family="IBM Plex Serif, serif" font-size="12.5" font-weight="700" fill="#8fd9b3">AI Governed Assistant</text>
  <rect x="48" y="182" width="360" height="34" rx="10" fill="#1c3a52" />
  <text x="60" y="203" font-family="IBM Plex Sans, sans-serif" font-size="9.5" fill="#ffffff" opacity="0.85">Why did gross margin move in the West region?</text>
  <rect x="48" y="224" width="484" height="40" rx="10" fill="#21ad65" opacity="0.16" />
  <text x="60" y="240" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#c8f0da">Margin dipped after two discounted orders and one</text>
  <text x="60" y="253" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="#c8f0da">expedited freight charge. Source transactions linked.</text>

  <!-- KPI bar row -->
  <g transform="translate(30,306)">
    <rect x="0" y="40" width="22" height="60" rx="4" fill="#1c3a52" />
    <rect x="34" y="24" width="22" height="76" rx="4" fill="#1c3a52" />
    <rect x="68" y="8" width="22" height="92" rx="4" fill="#21ad65" />
    <rect x="102" y="30" width="22" height="70" rx="4" fill="#1c3a52" />
  </g>
  <rect x="180" y="306" width="370" height="94" rx="12" fill="#1c3a52" opacity="0.5" />
  <text x="198" y="328" font-family="IBM Plex Sans, sans-serif" font-size="9.5" fill="#ffffff" opacity="0.65">Response limited to authorized records</text>
  <text x="198" y="344" font-family="IBM Plex Sans, sans-serif" font-size="9.5" fill="#ffffff" opacity="0.65">and logged for review.</text>
  <rect x="198" y="360" width="150" height="24" rx="12" fill="#21ad65" />
  <text x="273" y="376" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9.5" font-weight="700" fill="#0f2438">Open Related Records</text>
</svg>
